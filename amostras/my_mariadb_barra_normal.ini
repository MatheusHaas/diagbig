# MariaDB: caminhos com barra normal e log-error relativo à datadir, sem extensão
[client]
port=3306

[mysqld]
port=3306
basedir="C:/Program Files/MariaDB 10.4/"
datadir=C:/Program Files/MariaDB 10.4/data/
log-error=erros_mariadb   # sem extensão: vira erros_mariadb.err na datadir
max_connections=200
innodb_buffer_pool_size=512M
