# LEGENDA
# Uma cerquilha: não alterar. Mudar pode impedir o banco de iniciar ou quebrar o sistema BIG.
## Duas cerquilhas: pode ajustar. Afeta desempenho ou proteção dos dados, por conta de quem alterou.

[mysqld]
# Pasta onde ficam os bancos de dados
datadir=C:/Program Files/MariaDB 10.4/data

## Porta TCP em que o banco atende as conexões; o sistema BIG e a regra de firewall dependem dela
port=3307

## Memória que o InnoDB usa como cache de dados e índices (principal ajuste de desempenho). 
## Nunca passar de cerca de 80% da RAM do computador, ou o banco não inicia
innodb_buffer_pool_size=2G

# Tamanho de cada um dos 2 arquivos de log de transações. 
# Só pode ser alterado com o serviço parado corretamente
innodb_log_file_size=125M

## Quantas operações de disco por segundo o InnoDB pode usar em segundo plano: HD = 200, SSD = 1000
innodb_io_capacity=1000

## Protege as tabelas contra gravação incompleta em quedas de energia. 
## Manter ON, principalmente em servidores sem nobreak ou desligados com frequência; 
## DESLIGAR SOMENTE NOS CASOS ONDE TEM NOBREAK
innodb_doublewrite=ON

# Grava direto no disco, sem passar pelo cache do Windows
innodb_flush_method=O_DIRECT

## Quando o log de transações é gravado no disco:
## 1 = a cada transação, mais seguro e mais lento; 
## 2 = a cada ~1 segundo, mais rápido, mas uma queda de energia pode perder até ~1 segundo de transações
## Evitar usar caso ocorra vários reinicios
innodb_flush_log_at_trx_commit=1

## Percentual de preenchimento das páginas de índice ao reconstruir, deixando espaço para inserções futuras
innodb_fill_factor=90

## Registra no arquivo .err todos os deadlocks, travamentos entre transações, para diagnóstico
innodb_print_all_deadlocks=ON

# Motor padrão para tabelas novas
default_storage_engine=InnoDB

# Motor padrão para tabelas temporárias criadas pelo usuário
default_tmp_storage_engine=InnoDB

# Repara automaticamente tabelas MyISAM do ATUALIZADOR danificadas, guardando backup antes
# myisam_recover_options=BACKUP,FORCE

# Modo SQL: apenas impede trocar o motor da tabela silenciosamente
sql_mode="NO_ENGINE_SUBSTITUTION"

# Nível de isolamento: cada consulta enxerga só o que já foi confirmado, com menos travamentos
transaction_isolation=READ-COMMITTED

## Quantos dias os arquivos de log binário são mantidos antes de serem apagados automaticamente.
## O log binário registra todas as alterações feitas no banco, em arquivos como mysql-bin.000001, mysql-bin.000002 etc.
## Ele é usado para replicação entre servidores e para recuperar os dados até um momento exato, por exemplo, restaurar um backup e reaplicar as alterações feitas depois dele.
## Só tem efeito se o log binário estiver ligado pela variável log_bin; sem ela, este valor não faz nada.
## Valor maior permite voltar mais dias no tempo, mas ocupa mais disco; valor menor economiza disco. Com 0, os arquivos nunca são apagados e podem lotar o disco.
expire_logs_days=7

## Liga o registro de consultas lentas, para diagnóstico de lentidão
slow_query_log=1

## Tempo em segundos a partir do qual uma consulta é registrada como lenta
long_query_time=10

## Máximo de conexões simultâneas, conforme o tamanho do cliente
max_connections=500

## Erros de conexão seguidos de um mesmo IP antes de bloqueá-lo
max_connect_errors=300

# Tamanho máximo de um pacote ou comando enviado ao banco; valor exigido pelo sistema
max_allowed_packet=512M

[client]
port=3307
plugin-dir=C:/Program Files/MariaDB 10.4/lib/plugin