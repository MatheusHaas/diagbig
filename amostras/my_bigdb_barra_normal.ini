# my.ini do BIG_db: caminhos com barra normal e log-error relativo à datadir, sem extensão
[client]
port=3306

[mysqld]
port=3306
basedir="C:/BIG_db/"
datadir=C:/BIG_db/data/
log-error=erros_bigdb   # sem extensão: vira erros_bigdb.err na datadir
max_connections=200
innodb_buffer_pool_size=512M
